<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .bar { fill: #161b22; }
      .btn-red { fill: #ff5f56; }
      .btn-yel { fill: #ffbd2e; }
      .btn-grn { fill: #27c93f; }
      .title { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; text-anchor: middle; font-weight: 500; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; line-height: 20px; }
      .prompt { fill: #58a6ff; font-weight: 600; }
      .cmd { fill: #f0f6fc; font-weight: 600; }
      .dim { fill: #6e7681; }
      .text { fill: #c9d1d9; }
      .cyan { fill: #39c5bb; font-weight: 600; }
      .green { fill: #3fb950; font-weight: 600; }
      .bold { font-weight: bold; }
    </style>
  </defs>
  <!-- Window frame -->
  <rect class="bg" width="900" height="520" rx="10" stroke="#30363d" stroke-width="1"/>
  <rect class="bar" width="900" height="38" rx="10"/>
  <rect class="bar" y="28" width="900" height="10"/>
  <!-- Window buttons -->
  <circle class="btn-red" cx="20" cy="19" r="6"/>
  <circle class="btn-yel" cx="40" cy="19" r="6"/>
  <circle class="btn-grn" cx="60" cy="19" r="6"/>
  <text class="title" x="450" y="23">audit@linux-node-01: ~ (Clean Scan)</text>

  <!-- Terminal content -->
  <text class="mono" x="25" y="70">
    <tspan class="prompt">audit@linux-node-01:~$ </tspan><tspan class="cmd">persisthunt scan</tspan>
  </text>
  <text class="mono dim" x="25" y="95">[+] Scanning cron persistence...</text>
  <text class="mono dim" x="25" y="115">[+] Scanning systemd persistence...</text>
  <text class="mono dim" x="25" y="135">[+] Scanning ssh persistence...</text>
  <text class="mono dim" x="25" y="155">[+] Scanning shell persistence...</text>
  <text class="mono dim" x="25" y="175">[+] Scanning suid persistence...</text>
  <text class="mono dim" x="25" y="195">[+] Scanning process persistence...</text>
  <text class="mono dim" x="25" y="215">[+] Scanning account persistence...</text>

  <text class="mono cyan bold" x="25" y="250">PersistHunt</text>
  <text class="mono dim" x="25" y="270">Linux Persistence Detection Framework</text>
  <text class="mono green bold" x="25" y="295">&#x2714; Scan complete.</text>

  <text class="mono bold text" x="25" y="325">Findings: 0</text>
  <text class="mono dim" x="25" y="345">CRITICAL: 0  |  HIGH: 0  |  MEDIUM: 0  |  LOW: 0</text>

  <text class="mono green bold" x="25" y="375">Risk Score: 0.0/10 (CLEAN)</text>

  <text class="mono cyan bold" x="25" y="410">=== Detector Status ===</text>
  <text class="mono text" x="25" y="430">- cron: <tspan class="green">SUCCESSFUL</tspan> (0 findings)</text>
  <text class="mono text" x="25" y="450">- systemd: <tspan class="green">SUCCESSFUL</tspan> (0 findings)   - ssh: <tspan class="green">SUCCESSFUL</tspan> (0 findings)</text>
  <text class="mono text" x="25" y="470">- shell: <tspan class="green">SUCCESSFUL</tspan> (0 findings)     - suid: <tspan class="green">SUCCESSFUL</tspan> (0 findings)</text>
  <text class="mono text" x="25" y="490">- process: <tspan class="green">SUCCESSFUL</tspan> (0 findings)   - account: <tspan class="green">SUCCESSFUL</tspan> (0 findings)</text>
</svg>
