<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .bar { fill: #161b22; }
      .btn-red { fill: #ff5f56; }
      .btn-yel { fill: #ffbd2e; }
      .btn-grn { fill: #27c93f; }
      .title { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; text-anchor: middle; font-weight: 500; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; line-height: 20px; }
      .prompt { fill: #58a6ff; font-weight: 600; }
      .cmd { fill: #f0f6fc; font-weight: 600; }
      .dim { fill: #6e7681; }
      .text { fill: #c9d1d9; }
      .cyan { fill: #39c5bb; font-weight: 600; }
      .red { fill: #f85149; font-weight: 600; }
      .orange { fill: #f0883e; font-weight: 600; }
      .yellow { fill: #d29922; font-weight: 600; }
      .blue { fill: #58a6ff; font-weight: 600; }
      .bold { font-weight: bold; }
    </style>
  </defs>
  <!-- Window frame -->
  <rect class="bg" width="900" height="520" rx="10" stroke="#30363d" stroke-width="1"/>
  <rect class="bar" width="900" height="38" rx="10"/>
  <rect class="bar" y="28" width="900" height="10"/>
  <!-- Window buttons -->
  <circle class="btn-red" cx="20" cy="19" r="6"/>
  <circle class="btn-yel" cx="40" cy="19" r="6"/>
  <circle class="btn-grn" cx="60" cy="19" r="6"/>
  <text class="title" x="450" y="23">audit@linux-node-01: ~ (Risk Scoring Summary)</text>

  <!-- Terminal content -->
  <text class="mono" x="25" y="70">
    <tspan class="prompt">audit@linux-node-01:~$ </tspan><tspan class="cmd">persisthunt scan</tspan>
  </text>
  <text class="mono cyan bold" x="25" y="105">PersistHunt</text>
  <text class="mono dim" x="25" y="125">Linux Persistence Detection Framework</text>
  <text class="mono red bold" x="25" y="150">&#x26A0; Scan complete.</text>

  <text class="mono bold text" x="25" y="180">Findings: 10</text>
  <text class="mono" x="25" y="200">
    <tspan class="red bold">CRITICAL: 1</tspan>  |  <tspan class="orange bold">HIGH: 2</tspan>  |  <tspan class="yellow bold">MEDIUM: 4</tspan>  |  <tspan class="blue bold">LOW: 3</tspan>
  </text>

  <text class="mono red bold" x="25" y="235" font-size="15px">Risk Score: 7.2/10 (HIGH RISK)</text>

  <text class="mono cyan bold" x="25" y="275">=== Risk Score Explanation ===</text>
  <text class="mono text" x="25" y="300">Mathematical Model: Deterministic Severity-Weighted Aggregation</text>
  <text class="mono dim" x="25" y="325">  - CRITICAL : 1 finding(s) x 10.0 weight = 10.0 pts</text>
  <text class="mono dim" x="25" y="345">  - HIGH     : 2 finding(s) x  6.0 weight = 12.0 pts</text>
  <text class="mono dim" x="25" y="365">  - MEDIUM   : 4 finding(s) x  3.0 weight = 12.0 pts</text>
  <text class="mono dim" x="25" y="385">  - LOW      : 3 finding(s) x  1.0 weight =  3.0 pts</text>
  <text class="mono text" x="25" y="415">Raw Accumulated Score : <tspan class="bold">37.0 pts</tspan></text>
  <text class="mono text" x="25" y="435">Normalization Divisor : <tspan class="dim">5.0</tspan></text>
  <text class="mono red bold" x="25" y="460">Normalized Score      : min(10.0, round(37.0 / 5.0, 1)) = 7.2 / 10</text>
</svg>
